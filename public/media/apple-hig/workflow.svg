<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" role="img" aria-labelledby="title desc"><title id="title">Seven-step design workflow with feedback</title><desc id="desc">Task, information, flow, prototype, test, implementation and maintenance form a repeatable loop.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#305fb4"/></marker></defs><rect width="1000" height="780" fill="#f5f3ee"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"><text x="44" y="44" font-size="16" fill="#305fb4" font-weight="650" text-anchor="start">03 / WORKFLOW</text><text x="44" y="90" font-size="34" fill="#253142" font-weight="650" text-anchor="start">From a task to evidence</text><text x="44" y="126" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Each step produces something a teammate or user can inspect.</text><rect x="78" y="164" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="205" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">01</text><text x="160" y="192" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Define the task</text><text x="160" y="216" font-size="17" fill="#576477" font-weight="400" text-anchor="start">Task, context, evidence and assumptions</text><path d="M120 227 V237" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="238" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="279" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">02</text><text x="160" y="266" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Organize information</text><text x="160" y="290" font-size="17" fill="#576477" font-weight="400" text-anchor="start">A clear map of content and destinations</text><path d="M120 301 V311" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="312" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="353" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">03</text><text x="160" y="340" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Design the flow</text><text x="160" y="364" font-size="17" fill="#576477" font-weight="400" text-anchor="start">Navigation, states and recovery paths</text><path d="M120 375 V385" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="386" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="427" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">04</text><text x="160" y="414" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Build a small prototype</text><text x="160" y="438" font-size="17" fill="#576477" font-weight="400" text-anchor="start">One complete interaction to try</text><path d="M120 449 V459" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="460" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="501" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">05</text><text x="160" y="488" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Test and revise</text><text x="160" y="512" font-size="17" fill="#576477" font-weight="400" text-anchor="start">Observed behavior and prioritized findings</text><path d="M120 523 V533" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="534" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="575" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">06</text><text x="160" y="562" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Implement and verify</text><text x="160" y="586" font-size="17" fill="#576477" font-weight="400" text-anchor="start">Acceptance criteria and a checked result</text><path d="M120 597 V607" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="78" y="608" width="810" height="62" rx="13" fill="white" stroke="#d4dbe2"/><text x="99" y="649" font-size="23" fill="#305fb4" font-weight="650" text-anchor="start">07</text><text x="160" y="636" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Observe and maintain</text><text x="160" y="660" font-size="17" fill="#576477" font-weight="400" text-anchor="start">The next question and a decision record</text><path d="M893 639 H937 V194 H901" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="474" y="714" font-size="20" fill="#397466" font-weight="500" text-anchor="middle">Evidence can send the work back to an earlier decision.</text><text x="44" y="755" font-size="14" fill="#576477" font-weight="400" text-anchor="start">Original study illustration · Based on Apple HIG · Not an Apple UI specification</text></g></svg>