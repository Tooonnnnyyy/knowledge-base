<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Adapt a reading layout to available space</title><desc id="desc">A wide two-column view becomes a narrow reading view with a visible Topics control.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#305fb4"/></marker></defs><rect width="1000" height="760" fill="#f5f3ee"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"><text x="44" y="44" font-size="16" fill="#305fb4" font-weight="650" text-anchor="start">02 / LAYOUT</text><text x="44" y="90" font-size="34" fill="#253142" font-weight="650" text-anchor="start">One task, more than one arrangement</text><text x="44" y="126" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Adapt to the available space and preserve recognizable functionality.</text><text x="44" y="183" font-size="18" fill="#305fb4" font-weight="650" text-anchor="start">WIDE SPACE</text><text x="686" y="183" font-size="18" fill="#305fb4" font-weight="650" text-anchor="start">NARROW SPACE</text><rect x="44" y="206" width="584" height="379" rx="18" fill="white" stroke="#d4dbe2"/><rect x="686" y="206" width="270" height="379" rx="18" fill="white" stroke="#d4dbe2"/><rect x="44" y="206" width="584" height="51" rx="16" fill="#e8edf3" stroke="#d4dbe2"/><text x="65" y="239" font-size="22" fill="#253142" font-weight="600" text-anchor="start">Reading library</text><rect x="60" y="274" width="151" height="293" rx="10" fill="#f1f4f7" stroke="none"/><text x="77" y="311" font-size="21" fill="#253142" font-weight="600" text-anchor="start">Topics</text><text x="77" y="355" font-size="19" fill="#305fb4" font-weight="600" text-anchor="start">Design</text><text x="77" y="403" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Systems</text><text x="77" y="451" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Data</text><text x="238" y="310" font-size="26" fill="#253142" font-weight="650" text-anchor="start">Adaptive layout</text><text x="238" y="346" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Hierarchy makes the</text><text x="238" y="376" font-size="20" fill="#576477" font-weight="400" text-anchor="start">reading task clear.</text><rect x="238" y="405" width="348" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="238" y="433" width="317" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="238" y="461" width="337" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="238" y="489" width="280" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="238" y="536" width="150" height="31" rx="8" fill="#e8effb" stroke="none"/><text x="252" y="558" font-size="17" fill="#305fb4" font-weight="600" text-anchor="start">Related notes</text><rect x="686" y="206" width="270" height="51" rx="16" fill="#e8edf3" stroke="#d4dbe2"/><text x="706" y="239" font-size="21" fill="#305fb4" font-weight="600" text-anchor="start">Topics</text><text x="925" y="239" font-size="25" fill="#305fb4" font-weight="400" text-anchor="end">≡</text><text x="706" y="304" font-size="26" fill="#253142" font-weight="650" text-anchor="start">Adaptive</text><text x="706" y="337" font-size="26" fill="#253142" font-weight="650" text-anchor="start">layout</text><text x="706" y="376" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Hierarchy makes</text><text x="706" y="404" font-size="20" fill="#576477" font-weight="400" text-anchor="start">the task clear.</text><rect x="706" y="434" width="226" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="706" y="462" width="208" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="706" y="490" width="220" height="9" rx="4" fill="#d4dbe3" stroke="none"/><rect x="706" y="536" width="185" height="31" rx="8" fill="#e8effb" stroke="none"/><text x="720" y="558" font-size="17" fill="#305fb4" font-weight="600" text-anchor="start">Related notes</text><path d="M638 394 H673" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><text x="44" y="634" font-size="22" fill="#305fb4" font-weight="650" text-anchor="start">What changes</text><text x="44" y="670" font-size="21" fill="#253142" font-weight="400" text-anchor="start">Column count, grouping and visible navigation.</text><text x="566" y="634" font-size="22" fill="#397466" font-weight="650" text-anchor="start">What stays available</text><text x="566" y="670" font-size="21" fill="#253142" font-weight="400" text-anchor="start">Read, navigate, return and explore.</text><text x="44" y="735" font-size="14" fill="#576477" font-weight="400" text-anchor="start">Original study illustration · Based on Apple HIG · Not an Apple UI specification</text></g></svg>