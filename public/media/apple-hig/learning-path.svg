<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="title desc"><title id="title">A connected route through Apple design resources</title><desc id="desc">Five study stages each pair a question with an inspectable practice output.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#305fb4"/></marker></defs><rect width="1000" height="770" fill="#f5f3ee"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"><text x="44" y="44" font-size="16" fill="#305fb4" font-weight="650" text-anchor="start">05 / LEARNING PATH</text><text x="44" y="90" font-size="34" fill="#253142" font-weight="650" text-anchor="start">Watch with a question. Finish with a decision.</text><text x="44" y="126" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Connect each resource to a focused note and a small piece of practice.</text><rect x="44" y="177" width="912" height="77" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="223" font-size="24" fill="#305fb4" font-weight="650" text-anchor="start">01</text><text x="125" y="208" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Principles</text><text x="125" y="235" font-size="18" fill="#576477" font-weight="400" text-anchor="start">What matters to the person?</text><text x="542" y="223" font-size="21" fill="#397466" font-weight="550" text-anchor="start">Explain one tradeoff.</text><path d="M83 255 V268" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="269" width="912" height="77" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="315" font-size="24" fill="#305fb4" font-weight="650" text-anchor="start">02</text><text x="125" y="300" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Layout</text><text x="125" y="327" font-size="18" fill="#576477" font-weight="400" text-anchor="start">What should be seen first?</text><text x="542" y="315" font-size="21" fill="#397466" font-weight="550" text-anchor="start">Sketch two available widths.</text><path d="M83 347 V360" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="361" width="912" height="77" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="407" font-size="24" fill="#305fb4" font-weight="650" text-anchor="start">03</text><text x="125" y="392" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Visual design</text><text x="125" y="419" font-size="18" fill="#576477" font-weight="400" text-anchor="start">Can everyone perceive it?</text><text x="542" y="407" font-size="21" fill="#397466" font-weight="550" text-anchor="start">Check text, theme and motion.</text><path d="M83 439 V452" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="453" width="912" height="77" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="499" font-size="24" fill="#305fb4" font-weight="650" text-anchor="start">04</text><text x="125" y="484" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Prototyping</text><text x="125" y="511" font-size="18" fill="#576477" font-weight="400" text-anchor="start">What is still uncertain?</text><text x="542" y="499" font-size="21" fill="#397466" font-weight="550" text-anchor="start">Try one complete task.</text><path d="M83 531 V544" fill="none" stroke="#305fb4" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="545" width="912" height="77" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="591" font-size="24" fill="#305fb4" font-weight="650" text-anchor="start">05</text><text x="125" y="576" font-size="22" fill="#253142" font-weight="650" text-anchor="start">Review</text><text x="125" y="603" font-size="18" fill="#576477" font-weight="400" text-anchor="start">What did the evidence show?</text><text x="542" y="591" font-size="21" fill="#397466" font-weight="550" text-anchor="start">Revise and link the finding.</text><text x="44" y="690" font-size="21" fill="#305fb4" font-weight="600" text-anchor="start">Source → principle → example → decision → evidence → related concept</text><text x="44" y="745" font-size="14" fill="#576477" font-weight="400" text-anchor="start">Original study illustration · Based on Apple HIG · Not an Apple UI specification</text></g></svg>