<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Eight principles, one useful outcome</title><desc id="desc">Eight paired cards connect to a central human outcome.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#305fb4"/></marker></defs><rect width="1000" height="760" fill="#f5f3ee"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"><text x="44" y="44" font-size="16" fill="#305fb4" font-weight="650" text-anchor="start">01 / PRINCIPLES</text><text x="44" y="90" font-size="34" fill="#253142" font-weight="650" text-anchor="start">Design around a useful human outcome</text><text x="44" y="126" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Eight principles help weigh decisions throughout an experience.</text><rect x="374" y="327" width="252" height="174" rx="28" fill="#e8effb" stroke="#b6c6e3"/><text x="500" y="390" font-size="30" fill="#305fb4" font-weight="650" text-anchor="middle">A person</text><text x="500" y="433" font-size="24" fill="#253142" font-weight="600" text-anchor="middle">achieves a goal</text><text x="500" y="470" font-size="19" fill="#576477" font-weight="400" text-anchor="middle">with confidence</text><rect x="44" y="177" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="214" font-size="25" fill="#305fb4" font-weight="650" text-anchor="start">Purpose</text><text x="66" y="251" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Make the task matter.</text><rect x="676" y="177" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="698" y="214" font-size="25" fill="#397466" font-weight="650" text-anchor="start">Flexibility</text><text x="698" y="251" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Adapt to real contexts.</text><path d="M324 228 C355 228 343 413 374 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><path d="M676 228 C647 228 657 413 626 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><rect x="44" y="302" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="339" font-size="25" fill="#305fb4" font-weight="650" text-anchor="start">Agency</text><text x="66" y="376" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Keep people in control.</text><rect x="676" y="302" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="698" y="339" font-size="25" fill="#397466" font-weight="650" text-anchor="start">Simplicity</text><text x="698" y="376" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Make the path clear.</text><path d="M324 353 C355 353 343 413 374 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><path d="M676 353 C647 353 657 413 626 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><rect x="44" y="427" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="464" font-size="25" fill="#305fb4" font-weight="650" text-anchor="start">Responsibility</text><text x="66" y="501" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Protect trust and data.</text><rect x="676" y="427" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="698" y="464" font-size="25" fill="#397466" font-weight="650" text-anchor="start">Craft</text><text x="698" y="501" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Care for every state.</text><path d="M324 478 C355 478 343 413 374 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><path d="M676 478 C647 478 657 413 626 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><rect x="44" y="552" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="66" y="589" font-size="25" fill="#305fb4" font-weight="650" text-anchor="start">Familiarity</text><text x="66" y="626" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Build on what is known.</text><rect x="676" y="552" width="280" height="102" rx="18" fill="white" stroke="#d4dbe2"/><text x="698" y="589" font-size="25" fill="#397466" font-weight="650" text-anchor="start">Delight</text><text x="698" y="626" font-size="19" fill="#576477" font-weight="400" text-anchor="start">Choose the right feeling.</text><path d="M324 603 C355 603 343 413 374 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><path d="M676 603 C647 603 657 413 626 413" fill="none" stroke="#d4dbe2" stroke-width="2.5"/><text x="44" y="735" font-size="14" fill="#576477" font-weight="400" text-anchor="start">Original study illustration · Based on Apple HIG · Not an Apple UI specification</text></g></svg>