<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">Semantic meaning across themes and motion settings</title><desc id="desc">Three themes retain text and topic labels. A moving cue and a static connection communicate the same association.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#305fb4"/></marker></defs><rect width="1000" height="760" fill="#f5f3ee"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif"><text x="44" y="44" font-size="16" fill="#305fb4" font-weight="650" text-anchor="start">04 / VISUAL SYSTEM</text><text x="44" y="90" font-size="34" fill="#253142" font-weight="650" text-anchor="start">Keep meaning stable as appearance changes</text><text x="44" y="126" font-size="20" fill="#576477" font-weight="400" text-anchor="start">Text, color and motion work together to make the interface understandable.</text><rect x="44" y="176" width="292" height="286" rx="18" fill="#ffffff" stroke="#d4dbe2"/><text x="68" y="216" font-size="21" fill="#253142" font-weight="600" text-anchor="start">Light</text><text x="68" y="262" font-size="25" fill="#253142" font-weight="650" text-anchor="start">Reading a note</text><text x="68" y="300" font-size="20" fill="#536174" font-weight="400" text-anchor="start">A clear hierarchy.</text><text x="68" y="334" font-size="20" fill="#536174" font-weight="400" text-anchor="start">Comfortable text.</text><rect x="68" y="374" width="148" height="43" rx="10" fill="#dfe8fa" stroke="none"/><text x="85" y="402" font-size="18" fill="#253142" font-weight="600" text-anchor="start">Topic: Design</text><rect x="354" y="176" width="292" height="286" rx="18" fill="#1b2330" stroke="#d4dbe2"/><text x="378" y="216" font-size="21" fill="#edf2f9" font-weight="600" text-anchor="start">Dark</text><text x="378" y="262" font-size="25" fill="#edf2f9" font-weight="650" text-anchor="start">Reading a note</text><text x="378" y="300" font-size="20" fill="#bcc8da" font-weight="400" text-anchor="start">A clear hierarchy.</text><text x="378" y="334" font-size="20" fill="#bcc8da" font-weight="400" text-anchor="start">Comfortable text.</text><rect x="378" y="374" width="148" height="43" rx="10" fill="#334d76" stroke="none"/><text x="395" y="402" font-size="18" fill="#edf2f9" font-weight="600" text-anchor="start">Topic: Design</text><rect x="664" y="176" width="292" height="286" rx="18" fill="#efe5d1" stroke="#d4dbe2"/><text x="688" y="216" font-size="21" fill="#3c352b" font-weight="600" text-anchor="start">Paper</text><text x="688" y="262" font-size="25" fill="#3c352b" font-weight="650" text-anchor="start">Reading a note</text><text x="688" y="300" font-size="20" fill="#655b49" font-weight="400" text-anchor="start">A clear hierarchy.</text><text x="688" y="334" font-size="20" fill="#655b49" font-weight="400" text-anchor="start">Comfortable text.</text><rect x="688" y="374" width="148" height="43" rx="10" fill="#e0d2b6" stroke="none"/><text x="705" y="402" font-size="18" fill="#3c352b" font-weight="600" text-anchor="start">Topic: Design</text><text x="44" y="506" font-size="17" fill="#305fb4" font-weight="650" text-anchor="start">FULL MOTION</text><text x="551" y="506" font-size="17" fill="#397466" font-weight="650" text-anchor="start">REDUCED MOTION</text><path d="M74 561 H391" fill="none" stroke="#305fb4" stroke-width="2.5"/><circle cx="74" cy="561" r="13" fill="white" stroke="#305fb4" stroke-width="3"/><circle cx="391" cy="561" r="13" fill="white" stroke="#305fb4" stroke-width="3"/><circle cx="244" cy="561" r="7" fill="#305fb4"/><text x="209" y="607" font-size="19" fill="#576477" font-weight="400" text-anchor="start">moving cue</text><path d="M581 561 H898" fill="none" stroke="#397466" stroke-width="2.5"/><circle cx="581" cy="561" r="13" fill="white" stroke="#397466" stroke-width="3"/><circle cx="898" cy="561" r="13" fill="white" stroke="#397466" stroke-width="3"/><text x="680" y="607" font-size="19" fill="#576477" font-weight="400" text-anchor="start">static connection</text><text x="44" y="663" font-size="22" fill="#253142" font-weight="500" text-anchor="start">A label and a visible connection preserve the information in both states.</text><text x="44" y="735" font-size="14" fill="#576477" font-weight="400" text-anchor="start">Original study illustration · Based on Apple HIG · Not an Apple UI specification</text></g></svg>